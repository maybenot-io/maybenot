[package]
name = "maybenot-simulator"
version = "3.0.0"
description = "A fast and flexible simulator for the Maybenot framework"
authors = ["Tobias Pulls <tobias@pulls.name>, Johan Garcia <jg@applia.se>"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[features]
# Enable tests that require generated trace files (large, slow to generate)
trace-tests = []

[lints]
workspace = true

[dependencies]
# defaults to relative path in workspace
maybenot = { version = "3.0.0", path = "../maybenot/" }
log = "0.4.21"
test-log = "0.2.15"
rand = "0.10"
serde_json = "1.0.116"
enum-map = "2.7.3"
rand_xoshiro = "0.8"
rand_core = "0.10"
rand_distr = "0.6"
serde = { version = "1.0.198", features = ["derive"] }
serde-big-array = "0.5.1"
toml = "0.8"
ndarray = { version = "0.16", features = ["serde"] }
ndarray-npy = "0.7"  # Optional, if using .npy files
ndarray-stats = "0.5.1"
bincode = "1.3.3"
flate2 = "1.0"
chrono = "0.4.38"
clap = { version = "4.5.16", features = ["derive"] }
rayon = "1.10"

[dev-dependencies]
env_logger = "0.10.2"
criterion = "0.5.1"
once_cell = "1.21.1"

[[bench]]
name = "sim"
harness = false
