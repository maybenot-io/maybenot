[package]
name = "maybenot"
version = "2.2.2"
description = "A framework for traffic analysis defenses"
authors = ["Tobias Pulls <tobias@pulls.name>", "Ethan Witwer <ethan@ethanwitwer.com>"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
rand="0.10"
rand_distr = "0.6"
serde = {version = "1.0", features = ["derive"]}
bincode = "1.3"
base64 = "0.22"
flate2 = "1.1.2"
enum-map = "2.7"
# TODO: Replace with official crates.io release
sha256 = { git = "https://github.com/baoyachi/sha256-rs", rev = "3aeea01ab752646bc17ee3fb0dff4781020adb1f", default-features = false }
rand_core = "0.10"
