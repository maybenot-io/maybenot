[package]
name = "maybenot-machine-parser"
version = "1.0.0"
description = "Legacy machine string parser for Maybenot (v1 and v2 → v3)"
readme = "README.md"
edition.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
maybenot = { path = "../maybenot" }
enum-map = "2"
bincode = "1.3"
base64 = "0.22"
flate2 = "1.1"
byteorder = "1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
