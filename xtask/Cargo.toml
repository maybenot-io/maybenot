[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false

# Multiple automation task binaries can be added here
[[bin]]
name = "linktrace"
path = "src/bin/linktrace.rs"

[lints]
workspace = true

[dependencies]
maybenot-simulator = { version = "3.0.0", path = "../crates/maybenot-simulator" }
clap = { version = "4.5.16", features = ["derive"] }
flate2 = "1.0"
